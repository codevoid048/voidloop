name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "server/src/**"
      - "server/main.py"
      - "server/Dockerfile.lambda"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      force_migrate:
        description: "Run migrations even if no migration files changed"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-2' }}
  PROJECT_NAME: voidloop
  ENVIRONMENT: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Debug OIDC claims
        working-directory: .
        run: |
          echo "github.repository=${{ github.repository }}"
          echo "github.ref=${{ github.ref }}"
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)"
          PAYLOAD="$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, repository_id, repository_owner_id}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag from pyproject.toml
        id: version
        run: |
          VERSION="$(grep -E '^version[[:space:]]*=' pyproject.toml | head -n 1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read version from pyproject.toml" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image tag: v${VERSION}"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          REPO_NAME="${PROJECT_NAME}-${ENVIRONMENT}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${REPO_NAME}:${{ steps.version.outputs.tag }}"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "Image URI: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.lambda
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr.outputs.registry }}/${{ steps.image.outputs.repo }}:latest
          provenance: false
          sbom: false

      - name: Detect migration changes
        id: migrations
        working-directory: .
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_migrate }}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forcing migrations via workflow_dispatch"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch without force_migrate; skipping migrate"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit; running migrations"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -E '^server/.+/migrations/' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed under server/"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No server migration file changes"
          fi

      - name: Run migrations
        if: steps.migrations.outputs.changed == 'true'
        run: |
          PARAM_PREFIX="/${PROJECT_NAME}/${ENVIRONMENT}"
          DATABASE_URL="$(aws ssm get-parameter \
            --name "${PARAM_PREFIX}/database_url" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query 'Parameter.Value' \
            --output text)"
          SECRET_KEY="$(aws ssm get-parameter \
            --name "${PARAM_PREFIX}/django_secret_key" \
            --with-decryption \
            --region "${AWS_REGION}" \
            --query 'Parameter.Value' \
            --output text)"

          docker pull "${{ steps.image.outputs.uri }}"
          docker run --rm \
            --entrypoint sh \
            -e DJANGO_ENV=production \
            -e DEBUG=False \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e SECRET_KEY="${SECRET_KEY}" \
            "${{ steps.image.outputs.uri }}" \
            -lc "python manage.py migrate --noinput"

      - name: Update Lambda function code
        run: |
          FUNCTION_NAME="${PROJECT_NAME}-${ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --region "${AWS_REGION}"
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}"
          echo "Lambda ${FUNCTION_NAME} updated to ${{ steps.image.outputs.uri }}"
