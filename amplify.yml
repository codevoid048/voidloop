version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@10 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -e '^API_URL=' >> .env.production
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
          - .pnpm-store/**/*
